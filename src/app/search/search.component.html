<div class="search-page">
  <h2 *ngIf="results.length">Resultaten voor "{{ query }}"</h2>
  <h2 *ngIf="!results.length">Geen resultaten voor "{{ query }}"</h2>

  <div class="film-list">
    <a
      *ngFor="let film of results"
      [routerLink]="getProductLink(film.id)"
      [fragment]="getProductFragment(film.id)"
      class="film-item"
    >
      <span class="search-result-cover cover-with-collection-badge">
        <img [src]="film.imageUrl" alt="{{ getResultTitle(film) }}" />
        <span
          *ngIf="isInCollection(film.id)"
          class="collection-cover-badge collection-cover-badge--thumb"
          aria-hidden="true"
        ></span>
      </span>
      <div class="info">
        <h3>{{ getResultTitle(film) }}</h3>
        <div class="info-details">
          <p *ngFor="let detail of getResultDetails(film)">{{ detail }}</p>
        </div>
      </div>
    </a>
  </div>
</div>
