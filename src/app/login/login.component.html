<div class="container">
  @if (!loading) {
    <form (ngSubmit)="login()" class="login-form">
      <h2>Login</h2>
      <input
        type="email"
        [(ngModel)]="email"
        name="email"
        placeholder="Email"
        required
        autocomplete="username"
        />
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Wachtwoord"
          required
          autocomplete="current-password"
          />
          <button type="submit">Inloggen</button>
          @if (message) {
            <p class="message">{{ message }}</p>
          }
        </form>
      } @else {
        <p>Even geduld, inloggen...</p>
      }

    </div>
