<div class="cart-container news-page faq-page">
  <h1>Frequently Asked Questions</h1>

  <div class="news-list faq-accordion">
    <article *ngFor="let faq of faqs; let i = index" class="news-card faq-item">
      <div class="news-card-header">
        <div class="news-copy">
          <h2>{{ faq.question }}</h2>
        </div>
      </div>

      <details class="news-details" [open]="faq.expanded">
        <summary
          [attr.aria-expanded]="faq.expanded"
          [attr.aria-controls]="'faq' + i"
          [id]="'faq' + i + '-btn'"
          (click)="toggle(i); $event.preventDefault()"
        >
          Read more
        </summary>
        <p
          class="content"
          [id]="'faq' + i"
          role="region"
          [attr.aria-labelledby]="'faq' + i + '-btn'"
        >
          {{ faq.answer }}
        </p>
      </details>
    </article>
  </div>
</div>
