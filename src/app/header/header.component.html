<header class="header-criterion">
  <nav class="nav-left">
  </nav>

  <nav class="nav-right">
    <a routerLink="/shopping" class="shop-link">Shop the collections</a>

    <a routerLink="/news" class="btn-news" aria-label="News" (click)="closeMenu()">News</a>

    <button class="icon-btn search-btn" aria-label="Search" (click)="toggleSearch()">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="white" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" width="18" height="18" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
    </button>

    <div *ngIf="showSearch" class="search-bar">
      <input
        type="text"
        [(ngModel)]="searchQuery"
        placeholder="Zoek op titel, regisseur, land of jaar"
        (input)="onSearchChange()"
        (keyup.enter)="onSearch()"
        autofocus
      />
      <ul *ngIf="filteredFilms.length" class="search-suggestions">
        <li *ngFor="let film of filteredFilms" (click)="goToFilm(film.id)">
          <img [src]="film.imageUrl" alt="{{film.title}}" width="40" height="60" />
          <span>{{ film.title }} ({{ film.year }})</span>
        </li>
      </ul>
    </div>

    <a routerLink="/account" class="icon-btn account-btn" aria-label="Account">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="white" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" width="18" height="18" viewBox="0 0 24 24">
        <circle cx="12" cy="7" r="4" />
        <path d="M5.5 21a6.5 6.5 0 0 1 13 0" />
      </svg>
    </a>

    <a routerLink="/cart" class="icon-btn cart-btn" aria-label="Cart">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="white" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" width="18" height="18" viewBox="0 0 24 24">
        <circle cx="7" cy="20" r="2" />
        <circle cx="17" cy="20" r="2" />
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h7.72a2 2 0 0 0 2-1.61L23 6H6" />
      </svg>
    </a>

    <button class="icon-btn hamburger-btn" aria-label="Menu" (click)="toggleMenu()">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="white" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" width="24" height="20" viewBox="0 0 24 24">
        <line x1="3" y1="6" x2="21" y2="6" />
        <line x1="3" y1="12" x2="21" y2="12" />
        <line x1="3" y1="18" x2="21" y2="18" />
      </svg>
    </button>
  </nav>
</header>

<nav class="hamburger-menu" [class.open]="menuOpen">
  <a class="vertical-text" routerLink="/about" (click)="closeMenu()">Home Cinema Project</a>
  <ul>
    <h1>The Collection</h1>
    <li><a routerLink="/shopping" (click)="closeMenu()">Complete collection</a></li>
    <li><a routerLink="/explore" (click)="closeMenu()">Explore History</a></li>
    <li><a routerLink="/" (click)="closeMenu()">Special Edition Boxsets</a></li>

    <h1>Account</h1>
    <li><a routerLink="/wishlist" (click)="closeMenu()">Wishlist</a></li>
    <li><a routerLink="/collection" (click)="closeMenu()">Collection</a></li>

    <h1>Other</h1>
    <li><a routerLink="/faq" (click)="closeMenu()">FAQ</a></li>
    <li><a routerLink="/about" (click)="closeMenu()">About</a></li>
  </ul>
</nav>
